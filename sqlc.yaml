version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/*.sql"
    queries:
      - "internal/store/queries/*.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        overrides:
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "uuid"
            go_type: "string"
