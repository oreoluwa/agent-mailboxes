name: Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version, for example 0.1.0-rc.1
        required: true
        type: string
      include_source:
        description: Include Git source export
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build exact-revision bundles
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          INCLUDE_SOURCE: ${{ inputs.include_source }}
        run: |
          args=(--version "$PACKAGE_VERSION" --ref "$GITHUB_SHA" --output dist)
          if [[ "$INCLUDE_SOURCE" == "true" ]]; then args+=(--source); fi
          python3 scripts/package-release.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-emails-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
